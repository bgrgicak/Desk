name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (host suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DESK_DEV: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage DESK_HOME (avoid /opt/desk fallback)
        # The DB is a SQLite file under DESK_HOME; tests that share state
        # across pools route to a per-process temp file derived from the
        # connection string they pass, so DESK_DB_PATH only needs to be
        # set for tests that explicitly read it.
        run: |
          mkdir -p "$RUNNER_TEMP/desk-home"
          echo "DESK_HOME=$RUNNER_TEMP/desk-home" >> "$GITHUB_ENV"
          echo "DESK_SECRET_KEY_PATH=$RUNNER_TEMP/desk-home/secret.key" >> "$GITHUB_ENV"
          echo "DESK_DB_PATH=$RUNNER_TEMP/desk-home/.database/desk.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build sandbox-cli (prereq for sandbox image)
        run: npm run build --workspace=@agent-desk/sandbox-cli

      - name: Build desk/sandbox:v1 image
        working-directory: packages/server
        # The image bakes a baseline `agent` user at UID 2000. At runtime
        # desk-server overrides this with `--user $(id -u):$(id -g)` of
        # the host process (or 0:0 under rootless docker), so the build
        # arg doesn't need tuning per-runner.
        run: docker build -f runtime/Dockerfile.sandbox -t desk/sandbox:v1 .

      - name: Run unit + integration tests (vitest)
        # `--retry=2` tolerates known flakes around async fireMessage polling
        # (see message-model-attachments, agent-delete); real failures still
        # fail after three attempts.
        run: npx vitest run --passWithNoTests --retry=2

      - name: Build @agent-desk/api (+ deps via nx) for the Playwright fixture
        # The Playwright fixture (`packages/app/e2e/fixtures/server.ts`)
        # spawns `node packages/server/api/dist/main.js`. nx's
        # `build.dependsOn: ["^build"]` walks the dep graph (shared, db,
        # storage, tools, runtime, scheduler) in topological order, so a
        # single `nx build @agent-desk/api` produces every `dist/` the spawned
        # process resolves through Node's default `import` condition.
        run: npx nx build @agent-desk/api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: packages/app

      - name: Run Playwright e2e tests
        # `--retries=2` catches timing flakes without masking deterministic
        # failures (still red after three attempts).
        run: npx playwright test --retries=2
        working-directory: packages/app

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/app/test-results/
          retention-days: 7
