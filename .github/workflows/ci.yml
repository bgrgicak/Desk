name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROOMY_DEV: "1"

jobs:
  prepare-server-dist:
    name: Prepare server build outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build @roomy-ai/api (+ deps) for tests
        # The Playwright fixture (`packages/app/e2e/fixtures/server.ts`)
        # spawns `node packages/server/api/dist/main.js`. Build the local server
        # workspaces in dependency order so the spawned process resolves through
        # Node's default `import` condition.
        run: npm run build:server

      - name: Archive server build outputs
        run: tar -czf "$RUNNER_TEMP/server-dist.tar.gz" packages/server/*/dist

      - name: Upload server build outputs
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}/server-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  prepare-sandbox-image:
    name: Prepare sandbox image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch
        # Multi-arch buildx wants binfmt registrations so arm64 layers
        # can be emulated on the amd64 runner.
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build roomy/sandbox:v1 image (multi-arch, loaded into local docker for tests)
        # The image bakes a baseline `agent` user at UID 2000. At runtime
        # roomy-server overrides this with `--user $(id -u):$(id -g)` of
        # the host process (or 0:0 under rootless docker), so the build
        # arg doesn't need tuning per-runner.
        #
        # Inject commit metadata via OCI labels so `docker inspect
        # roomy/sandbox:v1` on the runtime host can identify which commit
        # produced the image. The Dockerfile sets the static labels
        # (title, description, source, license); these three are the
        # commit-specific ones CI knows.
        #
        # Buildx's --load only supports a single platform at a time, so
        # we build the host arch (amd64) for the test/export path, and
        # follow with a buildx build that targets both arches just to
        # prove the Dockerfile is portable — output goes to the buildx
        # cache, not loaded.
        run: |
          docker buildx build \
            -f packages/server/runtime/Dockerfile.sandbox \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.version=${{ github.ref_name }}" \
            --load \
            --platform linux/amd64 \
            -t roomy/sandbox:v1 .

      - name: Verify roomy/sandbox:v1 builds for arm64 too
        # Multi-arch consumers (Apple Silicon contributors, arm cloud
        # hosts) need the Dockerfile to keep working under emulation.
        # This step's outputs aren't loaded into the local docker —
        # we only need build success. Cached layers from the previous
        # step keep this fast on consecutive builds.
        run: |
          docker buildx build \
            -f packages/server/runtime/Dockerfile.sandbox \
            --platform linux/arm64 \
            -t roomy/sandbox:v1-arm64 .

      - name: Smoke-test roomy/sandbox:v1
        # The image build can succeed while the entrypoint is broken
        # (missing binary, bad PATH, busted /opt/roomy-template/). Run
        # the roomy-agent binary that the sandbox is supposed to ship
        # — if exit is non-zero the image isn't usable.
        run: docker run --rm roomy/sandbox:v1 roomy-agent --help > /dev/null

      - name: Reproducible-build sanity check
        # Build the same Dockerfile a second time against the same
        # source tree and assert the image digest is identical. Build
        # non-determinism (timestamp ordering, dependency ordering,
        # locale-sensitive output) shows up here long before it bites
        # a security scan that depends on stable digests.
        #
        # SOURCE_DATE_EPOCH stabilises any tool that respects it.
        # --build-arg + base-image pinning by SHA also help, but the
        # main job is to surface drift visibly.
        run: |
          set -e
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          docker buildx build \
            -f packages/server/runtime/Dockerfile.sandbox \
            --build-arg SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH \
            --load --platform linux/amd64 \
            -t roomy/sandbox:v1-repro .
          ORIGINAL=$(docker image inspect roomy/sandbox:v1 --format '{{.Id}}')
          REBUILT=$(docker image inspect roomy/sandbox:v1-repro --format '{{.Id}}')
          echo "first build:  $ORIGINAL"
          echo "second build: $REBUILT"
          if [ "$ORIGINAL" != "$REBUILT" ]; then
            echo "::warning::sandbox image digest changed between builds — non-determinism detected"
            # Advisory: timestamps in apt-cache + npm install make
            # bit-identical digests hard to reach with the current
            # Dockerfile. Don't fail the build until the Dockerfile is
            # made reproducible (Phase 6.18 second pass).
          fi

      - name: Export roomy/sandbox:v1 image
        run: docker save roomy/sandbox:v1 | gzip > "$RUNNER_TEMP/roomy-sandbox-v1.tar.gz"

      - name: Upload sandbox image
        uses: actions/upload-artifact@v4
        with:
          name: roomy-sandbox-v1
          path: ${{ runner.temp }}/roomy-sandbox-v1.tar.gz
          if-no-files-found: error
          retention-days: 1

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage ROOMY_HOME (avoid /opt/roomy fallback)
        # The DB is a SQLite file under ROOMY_HOME; tests that share state
        # across pools route to a per-process temp file derived from the
        # connection string they pass, so ROOMY_DB_PATH only needs to be
        # set for tests that explicitly read it.
        run: |
          mkdir -p "$RUNNER_TEMP/roomy-home"
          echo "ROOMY_HOME=$RUNNER_TEMP/roomy-home" >> "$GITHUB_ENV"
          echo "ROOMY_DB_PATH=$RUNNER_TEMP/roomy-home/.database/roomy.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (eslint)
        # Flat config at the repo root covers every workspace except
        # packages/app/ (keeps its own React-specific config). Failing
        # rules are unused-vars, eqeqeq, prefer-const and no-empty.
        # no-console + no-explicit-any are warn-only while the
        # structured logger conversion lands as a follow-up.
        run: npm run lint

      - name: Dead-code scan (knip, advisory)
        # Knip surfaces unused files, exports, dependencies and binaries
        # across the monorepo. Run with --no-exit-code so the job is
        # advisory while the long-tail of intentional re-exports gets
        # configured away; flip to blocking once Unused-files + Unused-
        # dependencies are at zero. Config lives in /knip.json at the
        # repo root.
        run: npx knip --no-progress --no-exit-code

  vitest:
    name: Vitest (unit suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage ROOMY_HOME (avoid /opt/roomy fallback)
        # The DB is a SQLite file under ROOMY_HOME; tests that share state
        # across pools route to a per-process temp file derived from the
        # connection string they pass, so ROOMY_DB_PATH only needs to be
        # set for tests that explicitly read it.
        run: |
          mkdir -p "$RUNNER_TEMP/roomy-home"
          echo "ROOMY_HOME=$RUNNER_TEMP/roomy-home" >> "$GITHUB_ENV"
          echo "ROOMY_DB_PATH=$RUNNER_TEMP/roomy-home/.database/roomy.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        run: |
          npx vitest run \
            --exclude '**/integration/**' \
            --exclude '**/*.integration.test.ts' \
            --exclude '**/e2e/**' \
            --exclude '**/e2e.test.ts' \
            --passWithNoTests \
            --reporter=verbose

  vitest-integration:
    name: Vitest (integration suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare-sandbox-image

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage ROOMY_HOME (avoid /opt/roomy fallback)
        run: |
          mkdir -p "$RUNNER_TEMP/roomy-home"
          echo "ROOMY_HOME=$RUNNER_TEMP/roomy-home" >> "$GITHUB_ENV"
          echo "ROOMY_DB_PATH=$RUNNER_TEMP/roomy-home/.database/roomy.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Download sandbox image
        uses: actions/download-artifact@v4
        with:
          name: roomy-sandbox-v1
          path: ${{ runner.temp }}

      - name: Load roomy/sandbox:v1 image
        run: docker load -i "$RUNNER_TEMP/roomy-sandbox-v1.tar.gz"

      - name: Run integration tests (vitest)
        # `--retry=2` tolerates known flakes around async fireMessage polling;
        # verbose output makes the currently running file visible if CI stalls.
        run: |
          npx vitest run \
            'packages/server/**/*.integration.test.ts' \
            'packages/server/**/test/integration/**/*.test.ts' \
            'packages/server/api/test/e2e.test.ts' \
            --passWithNoTests \
            --retry=2 \
            --reporter=verbose

  playwright:
    name: Playwright e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - prepare-server-dist
      - prepare-sandbox-image

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage ROOMY_HOME (avoid /opt/roomy fallback)
        run: |
          mkdir -p "$RUNNER_TEMP/roomy-home"
          echo "ROOMY_HOME=$RUNNER_TEMP/roomy-home" >> "$GITHUB_ENV"
          echo "ROOMY_DB_PATH=$RUNNER_TEMP/roomy-home/.database/roomy.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Download server build outputs
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}

      - name: Restore server build outputs
        run: tar -xzf "$RUNNER_TEMP/server-dist.tar.gz"

      - name: Download sandbox image
        uses: actions/download-artifact@v4
        with:
          name: roomy-sandbox-v1
          path: ${{ runner.temp }}

      - name: Load roomy/sandbox:v1 image
        run: docker load -i "$RUNNER_TEMP/roomy-sandbox-v1.tar.gz"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: packages/app

      - name: Run Playwright e2e tests
        # `--retries=2` catches timing flakes without masking deterministic
        # failures (still red after three attempts).
        run: npx playwright test --retries=2
        working-directory: packages/app

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/app/test-results/
          retention-days: 7

  build-desktop-macos:
    name: Build desktop app (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:packages

      - name: Install desktop dependencies
        run: npm ci
        working-directory: packages/desktop

      - name: Build desktop TypeScript
        run: npm run build
        working-directory: packages/desktop

      - name: Package desktop app (macOS, directory only)
        run: ./node_modules/.bin/electron-builder --mac --dir
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  test:
    name: Test (host suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - prepare-server-dist
      - prepare-sandbox-image
      - typecheck
      - vitest
      - vitest-integration
      - playwright
      - build-desktop-macos
    if: ${{ always() }}

    steps:
      - name: Check required CI jobs
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          PREPARE_SERVER_DIST_RESULT: ${{ needs.prepare-server-dist.result }}
          PREPARE_SANDBOX_IMAGE_RESULT: ${{ needs.prepare-sandbox-image.result }}
          VITEST_RESULT: ${{ needs.vitest.result }}
          VITEST_INTEGRATION_RESULT: ${{ needs.vitest-integration.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          BUILD_DESKTOP_MACOS_RESULT: ${{ needs.build-desktop-macos.result }}
        run: |
          if [ "$PREPARE_SERVER_DIST_RESULT" != "success" ]; then
            echo "Prepare server build outputs did not pass: $PREPARE_SERVER_DIST_RESULT"
            exit 1
          fi
          if [ "$PREPARE_SANDBOX_IMAGE_RESULT" != "success" ]; then
            echo "Prepare sandbox image did not pass: $PREPARE_SANDBOX_IMAGE_RESULT"
            exit 1
          fi
          if [ "$TYPECHECK_RESULT" != "success" ]; then
            echo "Typecheck did not pass: $TYPECHECK_RESULT"
            exit 1
          fi
          if [ "$VITEST_RESULT" != "success" ]; then
            echo "Vitest did not pass: $VITEST_RESULT"
            exit 1
          fi
          if [ "$VITEST_INTEGRATION_RESULT" != "success" ]; then
            echo "Vitest integration did not pass: $VITEST_INTEGRATION_RESULT"
            exit 1
          fi
          if [ "$PLAYWRIGHT_RESULT" != "success" ]; then
            echo "Playwright did not pass: $PLAYWRIGHT_RESULT"
            exit 1
          fi
          if [ "$BUILD_DESKTOP_MACOS_RESULT" != "success" ]; then
            echo "Build desktop macOS did not pass: $BUILD_DESKTOP_MACOS_RESULT"
            exit 1
          fi
          echo "All required CI jobs passed."
