name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DESK_DEV: "1"

jobs:
  prepare-server-dist:
    name: Prepare server build outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build server packages for tests
        # The Playwright fixture (`packages/app/e2e/fixtures/server.ts`)
        # spawns `node packages/server/api/dist/main.js`. Build every server
        # workspace so each package has the `dist/` output resolved by Node's
        # default `import` condition.
        run: npm -ws --if-present run build

      - name: Archive server build outputs
        run: tar -czf "$RUNNER_TEMP/server-dist.tar.gz" packages/server/*/dist

      - name: Upload server build outputs
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}/server-dist.tar.gz
          if-no-files-found: error
          retention-days: 1

  prepare-sandbox-image:
    name: Prepare sandbox image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build desk/sandbox:v1 image
        # The image bakes a baseline `agent` user at UID 2000. At runtime
        # desk-server overrides this with `--user $(id -u):$(id -g)` of
        # the host process (or 0:0 under rootless docker), so the build
        # arg doesn't need tuning per-runner.
        run: docker build -f packages/server/runtime/Dockerfile.sandbox -t desk/sandbox:v1 .

      - name: Export desk/sandbox:v1 image
        run: docker save desk/sandbox:v1 | gzip > "$RUNNER_TEMP/desk-sandbox-v1.tar.gz"

      - name: Upload sandbox image
        uses: actions/upload-artifact@v4
        with:
          name: desk-sandbox-v1
          path: ${{ runner.temp }}/desk-sandbox-v1.tar.gz
          if-no-files-found: error
          retention-days: 1

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage DESK_HOME (avoid /opt/desk fallback)
        # The DB is a SQLite file under DESK_HOME; tests that share state
        # across pools route to a per-process temp file derived from the
        # connection string they pass, so DESK_DB_PATH only needs to be
        # set for tests that explicitly read it.
        run: |
          mkdir -p "$RUNNER_TEMP/desk-home"
          echo "DESK_HOME=$RUNNER_TEMP/desk-home" >> "$GITHUB_ENV"
          echo "DESK_SECRET_KEY_PATH=$RUNNER_TEMP/desk-home/secret.key" >> "$GITHUB_ENV"
          echo "DESK_DB_PATH=$RUNNER_TEMP/desk-home/.database/desk.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  vitest:
    name: Vitest (unit suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage DESK_HOME (avoid /opt/desk fallback)
        # The DB is a SQLite file under DESK_HOME; tests that share state
        # across pools route to a per-process temp file derived from the
        # connection string they pass, so DESK_DB_PATH only needs to be
        # set for tests that explicitly read it.
        run: |
          mkdir -p "$RUNNER_TEMP/desk-home"
          echo "DESK_HOME=$RUNNER_TEMP/desk-home" >> "$GITHUB_ENV"
          echo "DESK_SECRET_KEY_PATH=$RUNNER_TEMP/desk-home/secret.key" >> "$GITHUB_ENV"
          echo "DESK_DB_PATH=$RUNNER_TEMP/desk-home/.database/desk.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests (vitest)
        run: |
          npx vitest run \
            --exclude '**/integration/**' \
            --exclude '**/*.integration.test.ts' \
            --exclude '**/e2e/**' \
            --exclude '**/e2e.test.ts' \
            --passWithNoTests \
            --reporter=verbose

  vitest-integration:
    name: Vitest (integration suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare-sandbox-image

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage DESK_HOME (avoid /opt/desk fallback)
        run: |
          mkdir -p "$RUNNER_TEMP/desk-home"
          echo "DESK_HOME=$RUNNER_TEMP/desk-home" >> "$GITHUB_ENV"
          echo "DESK_SECRET_KEY_PATH=$RUNNER_TEMP/desk-home/secret.key" >> "$GITHUB_ENV"
          echo "DESK_DB_PATH=$RUNNER_TEMP/desk-home/.database/desk.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Download sandbox image
        uses: actions/download-artifact@v4
        with:
          name: desk-sandbox-v1
          path: ${{ runner.temp }}

      - name: Load desk/sandbox:v1 image
        run: docker load -i "$RUNNER_TEMP/desk-sandbox-v1.tar.gz"

      - name: Run integration tests (vitest)
        # `--retry=2` tolerates known flakes around async fireMessage polling;
        # verbose output makes the currently running file visible if CI stalls.
        run: |
          npx vitest run \
            'packages/server/**/*.integration.test.ts' \
            'packages/server/**/test/integration/**/*.test.ts' \
            'packages/server/api/test/e2e.test.ts' \
            --passWithNoTests \
            --retry=2 \
            --reporter=verbose

  playwright:
    name: Playwright e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - prepare-server-dist
      - prepare-sandbox-image

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Stage DESK_HOME (avoid /opt/desk fallback)
        run: |
          mkdir -p "$RUNNER_TEMP/desk-home"
          echo "DESK_HOME=$RUNNER_TEMP/desk-home" >> "$GITHUB_ENV"
          echo "DESK_SECRET_KEY_PATH=$RUNNER_TEMP/desk-home/secret.key" >> "$GITHUB_ENV"
          echo "DESK_DB_PATH=$RUNNER_TEMP/desk-home/.database/desk.sqlite3" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Download server build outputs
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ${{ runner.temp }}

      - name: Restore server build outputs
        run: tar -xzf "$RUNNER_TEMP/server-dist.tar.gz"

      - name: Download sandbox image
        uses: actions/download-artifact@v4
        with:
          name: desk-sandbox-v1
          path: ${{ runner.temp }}

      - name: Load desk/sandbox:v1 image
        run: docker load -i "$RUNNER_TEMP/desk-sandbox-v1.tar.gz"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: packages/app

      - name: Run Playwright e2e tests
        # `--retries=2` catches timing flakes without masking deterministic
        # failures (still red after three attempts).
        run: npx playwright test --retries=2
        working-directory: packages/app

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/app/test-results/
          retention-days: 7

  test:
    name: Test (host suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - prepare-server-dist
      - prepare-sandbox-image
      - typecheck
      - vitest
      - vitest-integration
      - playwright
    if: ${{ always() }}

    steps:
      - name: Check required CI jobs
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          PREPARE_SERVER_DIST_RESULT: ${{ needs.prepare-server-dist.result }}
          PREPARE_SANDBOX_IMAGE_RESULT: ${{ needs.prepare-sandbox-image.result }}
          VITEST_RESULT: ${{ needs.vitest.result }}
          VITEST_INTEGRATION_RESULT: ${{ needs.vitest-integration.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        run: |
          if [ "$PREPARE_SERVER_DIST_RESULT" != "success" ]; then
            echo "Prepare server build outputs did not pass: $PREPARE_SERVER_DIST_RESULT"
            exit 1
          fi
          if [ "$PREPARE_SANDBOX_IMAGE_RESULT" != "success" ]; then
            echo "Prepare sandbox image did not pass: $PREPARE_SANDBOX_IMAGE_RESULT"
            exit 1
          fi
          if [ "$TYPECHECK_RESULT" != "success" ]; then
            echo "Typecheck did not pass: $TYPECHECK_RESULT"
            exit 1
          fi
          if [ "$VITEST_RESULT" != "success" ]; then
            echo "Vitest did not pass: $VITEST_RESULT"
            exit 1
          fi
          if [ "$VITEST_INTEGRATION_RESULT" != "success" ]; then
            echo "Vitest integration did not pass: $VITEST_INTEGRATION_RESULT"
            exit 1
          fi
          if [ "$PLAYWRIGHT_RESULT" != "success" ]; then
            echo "Playwright did not pass: $PLAYWRIGHT_RESULT"
            exit 1
          fi
          echo "All required CI jobs passed."
