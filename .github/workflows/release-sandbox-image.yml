name: Release sandbox image

# On pushes to tags shaped like v0.1.0-alpha.0, build the sandbox
# Docker image and push it to Docker Hub as
#   <DOCKER_HUB_ORG>/sandbox:<tag-without-v>
# matching the npm version of @agent-desk/cli for the same tag.
#
# Requires repo secrets:
#   DOCKER_HUB_USERNAME — account that has push rights on DOCKER_HUB_ORG
#   DOCKER_HUB_TOKEN    — Docker Hub access token (not the password)
#   DOCKER_HUB_ORG      — repo namespace (e.g. "agentdesk"). If unset,
#                         the job is skipped — useful while §4's open
#                         question (org name) hasn't been settled.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0-alpha.0). Defaults to the dispatching ref."
        required: false

concurrency:
  group: release-sandbox-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push agent-desk sandbox image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      DOCKER_HUB_ORG: ${{ secrets.DOCKER_HUB_ORG }}

    steps:
      - name: Skip if Docker Hub secrets are not configured
        id: gate
        run: |
          if [ -z "$DOCKER_HUB_USERNAME" ] || [ -z "$DOCKER_HUB_TOKEN" ] || [ -z "$DOCKER_HUB_ORG" ]; then
            echo "Docker Hub secrets not configured — skipping image push." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Resolve image tag from ref
        if: steps.gate.outputs.skip != 'true'
        id: tag
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          # Strip leading "v" so the docker tag matches the npm version.
          VERSION="${REF#v}"
          if [ -z "$VERSION" ]; then
            echo "could not derive a version from ref ${REF}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip != 'true'

      - name: Log in to Docker Hub
        if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and push
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: packages/server
          file: packages/server/runtime/Dockerfile.sandbox
          push: true
          tags: |
            ${{ env.DOCKER_HUB_ORG }}/sandbox:${{ steps.tag.outputs.version }}
            ${{ env.DOCKER_HUB_ORG }}/sandbox:alpha
          # alpha tag tracks the latest prerelease so the CLI can pull
          # by a stable name when DESK_SANDBOX_IMAGE isn't pinned to a
          # specific version.
