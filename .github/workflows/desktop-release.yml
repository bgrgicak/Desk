name: Desktop Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Every Monday midnight UTC

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:packages

      - name: Install desktop dependencies
        run: npm ci
        working-directory: packages/desktop

      - name: Build desktop app
        run: npm run build
        working-directory: packages/desktop

      - name: Stage server bundle (workspace pkgs + transitive npm deps)
        run: npm run stage-server
        working-directory: packages/desktop

      - name: Package macOS app (arm64)
        run: npx electron-builder --mac --arm64 --publish never
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish to GitHub Releases
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          DATE="$(date -u '+%Y-%m-%d')"
          gh release delete desktop-latest --yes 2>/dev/null || true
          git push origin :refs/tags/desktop-latest 2>/dev/null || true
          gh release create desktop-latest \
            --title "Desktop (latest)" \
            --notes "macOS arm64 build from ${SHORT_SHA} on ${DATE}" \
            --prerelease \
            dist-electron/*.dmg
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
