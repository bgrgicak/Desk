name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (pack smoke test, no publish)"
        type: boolean
        default: false

jobs:
  publish:
    name: Build, smoke-test, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install npm dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:packages

      - name: Smoke test — npm pack (dry run)
        run: |
          npm pack --workspaces --dry-run 2>&1 | tee /tmp/pack-output.txt
          # Fail if any workspace produced no tarball estimate
          grep -q "Tarball Contents" /tmp/pack-output.txt

      - name: Publish all packages to npm (alpha tag)
        if: ${{ !inputs.dry_run }}
        run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
