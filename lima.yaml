# Lima config for the Desk dev VM.
# Driven by packages/server/setup/scripts/vm.sh, which injects the repo
# mount path and per-instance host port via `limactl --set`.

base:
  - template:ubuntu-24.04

cpus: 2
memory: 2GiB
disk: 20GiB

mounts:
  - location: "PLACEHOLDER_REPO_ROOT"
    mountPoint: "/desk"
    writable: true
  - location: "PLACEHOLDER_DESK_HOME"
    mountPoint: "/home/desk/Desk"
    writable: true

# virtiofs is the only Lima mount type on Linux that honors fsync and
# supports mmap correctly — both required once the SQLite DB lives on this
# mount. Pinning here makes the durability contract explicit instead of
# inheriting whatever default the local Lima version ships with.
mountType: "virtiofs"

portForwards:
  - guestPort: 8080
    hostPort: 3000
    hostIP: "0.0.0.0"

provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      bash /desk/packages/server/setup/install.sh
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      bash /desk/packages/server/setup/dev-provision.sh
