# Lima config for the Desk dev VM.
# Driven by packages/server/setup/scripts/vm.sh, which injects the repo
# mount path and per-instance host port via `limactl --set`.

base:
  - template:ubuntu-24.04

cpus: 2
memory: 2GiB
disk: 20GiB

mounts:
  - location: "PLACEHOLDER_REPO_ROOT"
    mountPoint: "/desk"
    writable: true
  - location: "PLACEHOLDER_DESK_HOME"
    mountPoint: "/home/desk/Desk"
    writable: true
    9p:
      # mapped-xattr stores file ownership in xattrs on the host, so the
      # guest can chown/chmod independently of the host user. With the
      # default `none` / `passthrough` model, writes from the guest's
      # `desk` user (UID 2000) get attributed to the host user that
      # spawned qemu — files come back owned by that host user (mode
      # 0644) and `desk` can't reopen them for write, breaking SQLite's
      # WAL/journal recovery on the second boot.
      securityModel: "mapped-xattr"

# mountType is injected per host by vm.sh:
#   - Linux: "9p" over qemu's virtio-9p transport. virtiofs would be
#     faster, but in practice Lima's virtiofsd refuses guest-side
#     ownership ops on the mount (chown returns EINVAL) and silently
#     maps host GIDs that the guest can't translate to "nogroup".
#   - macOS: "virtiofs". Lima's VZ driver only accepts virtiofs or
#     reverse-sshfs and rejects 9p at config validation time. Apple's
#     virtiofs implementation doesn't have Lima's virtiofsd's chown bug.
#
# The trade-off 9p normally brings — missing mmap support — doesn't bite
# us: pool.ts opens the DB with `locking_mode = EXCLUSIVE`, which keeps
# SQLite's WAL bookkeeping in process heap instead of an mmap'd `-shm`
# file (see https://www.sqlite.org/wal.html "Use of WAL Without
# Shared-Memory").
#
# The per-mount `9p:` block above is only consulted when mountType is
# 9p; Lima ignores it under virtiofs.

portForwards:
  - guestPort: 8080
    hostPort: 3000
    hostIP: "0.0.0.0"

provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      bash /desk/packages/server/setup/install.sh
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      bash /desk/packages/server/setup/dev-provision.sh
