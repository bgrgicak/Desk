# Lima config for the Desk dev VM.
# Driven by packages/server/setup/scripts/vm.sh, which injects the repo
# mount path and per-instance host port via `limactl --set`.

base:
  - template:ubuntu-24.04

cpus: 2
memory: 2GiB
disk: 20GiB

mounts:
  - location: "PLACEHOLDER_REPO_ROOT"
    mountPoint: "/desk"
    writable: true
  - location: "PLACEHOLDER_DESK_HOME"
    mountPoint: "/home/desk/Desk"
    writable: true

# 9p over qemu's virtio-9p transport. virtiofs would be faster, but in
# practice Lima's virtiofsd refuses guest-side ownership ops on the
# mount (chown returns EINVAL) and silently maps host GIDs that the
# guest can't translate to "nogroup" — so guest writes by the host-UID
# user fail with EINVAL even when the file mode would allow them.
#
# 9p has neither problem. The trade-off it would normally bring —
# missing mmap support — doesn't bite us: pool.ts opens the DB with
# `locking_mode = EXCLUSIVE`, which keeps SQLite's WAL bookkeeping in
# process heap instead of an mmap'd `-shm` file (see
# https://www.sqlite.org/wal.html "Use of WAL Without Shared-Memory").
mountType: "9p"

portForwards:
  - guestPort: 8080
    hostPort: 3000
    hostIP: "0.0.0.0"

provision:
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      bash /desk/packages/server/setup/install.sh
  - mode: system
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      bash /desk/packages/server/setup/dev-provision.sh
