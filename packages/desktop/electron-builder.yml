appId: com.agentdesk.desk
productName: Desk
copyright: Copyright © 2024 Agent Desk

directories:
  buildResources: assets
  output: dist-electron

files:
  - dist/**
  - "!dist/**/*.map"

extraResources:
  - from: ../server/api/dist
    to: server/api/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../server/db/dist
    to: server/db/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../server/shared/dist
    to: server/shared/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../server/storage/dist
    to: server/storage/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../server/runtime/dist
    to: server/runtime/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../server/scheduler/dist
    to: server/scheduler/dist
    filter:
      - "**/*"
      - "!**/*.map"
  - from: ../app/dist
    to: app/dist

asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"

afterPack: scripts/after-pack.mjs

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: assets/icons/icon.icns

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icons/icon.ico

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  icon: assets/icons/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

publish:
  provider: github
  releaseType: release
