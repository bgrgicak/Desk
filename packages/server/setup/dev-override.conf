[Service]
ExecStart=
ExecStart=/usr/bin/npx tsx watch /desk/packages/server/api/src/main.ts
WorkingDirectory=/desk/packages/server/api
Environment=NODE_ENV=development
Environment="NODE_OPTIONS=--conditions @desk/dev"
# 9p mount doesn't propagate inotify events; force chokidar to poll.
Environment=CHOKIDAR_USEPOLLING=1
Environment=CHOKIDAR_INTERVAL=500
Environment=DESK_RUN_BIN=/desk/node_modules/.bin/desk-run
# Pin the on-disk root explicitly (see /etc/desk-server/env). Without this,
# the API and the scheduler/runtime can disagree about where files live —
# uploads vanish from inside the sandbox.
Environment=DESK_HOME=/home/desk
# Auto-restart on crash (incl. OOM). The base unit has Restart=always; dev
# used to set Restart=no here which let a single SIGKILL take login offline.
Restart=on-failure
RestartSec=2s
# Cap dev memory so a runaway agent/tsx-watch leak trips this service, not
# the whole VM. 12G is generous on a 30G VM — leaves headroom for Postgres,
# Docker, and sandbox containers.
MemoryMax=12G
