[Service]
ExecStart=
ExecStart=/usr/bin/npx tsx watch /desk/packages/server/api/src/main.ts
WorkingDirectory=/desk/packages/server/api
Environment=NODE_ENV=development
# 9p mount doesn't propagate inotify events; force chokidar to poll.
Environment=CHOKIDAR_USEPOLLING=1
Environment=CHOKIDAR_INTERVAL=500
Restart=no
